# Tiny Tapeout project information
project:
  title:        "AOC 2025"      # Project title
  author:       "Boris Potapov"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Day 10 implementation for AOC 2025 in SystemVerilog"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "8x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_aoc_2025"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_aoc_2025.sv2v.v"
    - "day10_wrapper.sv2v.v"
    - "aoc-2025/src/popcount.sv2v.v"
    - "aoc-2025/src/popcount_chain.sv2v.v"
    - "aoc-2025/src/gf2_rref.sv2v.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "AXI in"
  ui[1]: "AXI in"
  ui[2]: "AXI in"
  ui[3]: "AXI in"
  ui[4]: "AXI in"
  ui[5]: "AXI in"
  ui[6]: "AXI in"
  ui[7]: "AXI in"

  # Outputs
  uo[0]: "AXI out"
  uo[1]: "AXI out"
  uo[2]: "AXI out"
  uo[3]: "AXI out"
  uo[4]: "AXI out"
  uo[5]: "AXI out"
  uo[6]: "AXI out"
  uo[7]: "AXI out"

  # Bidirectional pins
  uio[0]: "unused"
  uio[1]: "AXI out tready (in)"
  uio[2]: "AXI out tlast  (out)"
  uio[3]: "AXI out tvalid (out)"
  uio[4]: "unused"
  uio[5]: "AXI in tready (out)"
  uio[6]: "AXI in tlast  (in)"
  uio[7]: "AXI in tvalid (in)"

# Do not change!
yaml_version: 6
